[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truth-firewall"
version = "0.1.0"
description = "Independently verify bounded local Python coding tasks completed by Codex."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Truth Firewall Contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
truth-firewall = "truth_firewall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
truth_firewall = ["py.typed", "fixtures/demo/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
