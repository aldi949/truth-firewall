name: Tests and installation artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools (not product dependencies)
        run: python -m pip install build==1.6.1 twine==7.0.0 pipx==1.17.14 pytest==9.1.1
      - name: Existing verification tests
        run: python -m pytest --basetemp "${{ runner.temp }}/tf-tests"
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate metadata and archive contents
        shell: bash
        run: |
          python -m twine check --strict dist/*
          python tools/check_dist.py dist
      - name: pipx install, installed CLI, reinstall, upgrade and uninstall
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          python tools/check_pipx.py --wheel "$wheel" --work "${{ runner.temp }}/tf-pipx"
      - name: Rebuild and install sdist outside the source tree
        shell: pwsh
        run: |
          $sdist = (Get-ChildItem dist/*.tar.gz).FullName
          python -m pip wheel --no-deps "$sdist" --wheel-dir "${{ runner.temp }}/rebuilt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv "${{ runner.temp }}/installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = if ($IsWindows) { "${{ runner.temp }}/installed/Scripts/python.exe" } else { "${{ runner.temp }}/installed/bin/python" }
          $exe = if ($IsWindows) { "${{ runner.temp }}/installed/Scripts/truth-firewall.exe" } else { "${{ runner.temp }}/installed/bin/truth-firewall" }
          $wheel = (Get-ChildItem "${{ runner.temp }}/rebuilt/*.whl").FullName
          & $py -m pip install --no-deps --no-index "$wheel"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/smoke_installed.py --exe "$exe" --python "$py" --work "${{ runner.temp }}/sdist-smoke"
      - name: Downloadable candidate distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: truth-firewall-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
